name: Blender skit environment check

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: blender-env-check-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_SERIES: "4.5"   # LTS

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Machine info
        run: |
          { echo '### Runner'; echo '```'; echo "CPUs: $(nproc)"; free -h; df -h /; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            xvfb mesa-utils libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libxkbcommon-x11-0 libsm6 libice6 \
            espeak-ng ffmpeg

      - name: Find latest Blender ${{ env.BLENDER_SERIES }} release
        id: ver
        run: |
          v=$(curl -fsSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/" \
              | grep -oE "blender-${BLENDER_SERIES}\.[0-9]+-linux-x64\.tar\.xz" | sort -uV | tail -1)
          [ -n "$v" ] || { echo "::error::Could not find a Blender ${BLENDER_SERIES} Linux build"; exit 1; }
          echo "file=$v" >> "$GITHUB_OUTPUT"
          echo "Using $v"

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: ${{ steps.ver.outputs.file }}

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/${{ steps.ver.outputs.file }}" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Run Blender skit pipeline check
        run: BLENDER=~/blender/blender SKIT_OUT=Output bash ci/blender-check.sh

      - name: Report
        if: always()
        run: |
          if [ -f Output/report.txt ]; then
            { echo '### Skit environment report'; echo '```'; cat Output/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            # Also post as an annotation so it is readable via the public API.
            body=$(head -c 60000 Output/report.txt | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=Skit environment report::${body}"
          fi

      - name: Upload test video, stills and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: skit-env-check
          path: |
            Output/*.mp4
            Output/*.png
            Output/*.wav
            Output/*.txt
            Output/*.log
          if-no-files-found: ignore
