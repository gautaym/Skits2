name: Render हवलदार का भौकाल

# Edit skits/havaldar/render.json (label/res/samples/chunks) and push to render.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["skits/havaldar/render.json"]

permissions:
  contents: write

concurrency:
  group: render-havaldar
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      label: ${{ steps.p.outputs.label }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: p
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, "skits/havaldar")
          import timeline as TL
          cfg = json.load(open("skits/havaldar/render.json"))
          last = TL.f(TL.T["out"]) - 1
          n = cfg["chunks"]
          size = -(-last // n)
          chunks = [{"i": i, "range": f"{1 + i*size}-{min(last, (i+1)*size)}"} for i in range(n) if 1 + i*size <= last]
          print("matrix=" + json.dumps({"include": chunks}))
          print("label=" + cfg["label"])
          EOF

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/render-havaldar.yml
      - name: Install Blender (bpy 4.5 LTS) and ffmpeg
        run: |
          pip install -q bpy==4.5.16 imageio-ffmpeg
          mkdir -p ~/bin && ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" ~/bin/ffmpeg
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Render frames ${{ matrix.range }}
        run: |
          R=$(python -c "import json;print(json.load(open('skits/havaldar/render.json'))['res'])")
          SPP=$(python -c "import json;print(json.load(open('skits/havaldar/render.json'))['samples'])")
          python skits/havaldar/build.py --out out --frames ${{ matrix.range }} --res "$R" --samples "$SPP" 2>&1 \
            | grep -vE "^Fra:|degenerated triangle" | tail -40
          ls out/frames | wc -l
      - uses: actions/upload-artifact@v5
        with:
          name: frames-${{ matrix.i }}
          path: out/frames/*.png
          retention-days: 3

  assemble:
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          pattern: frames-*
          path: frames
          merge-multiple: true
      - name: Encode MP4 with audio
        run: |
          pip install -q imageio-ffmpeg
          FF=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          ls frames | wc -l
          if FFMPEG="$FF" python skits/havaldar/mix_audio.py mix.wav; then AUDIO=(-i mix.wav -c:a aac -b:a 192k -shortest); else AUDIO=(); fi
          "$FF" -y -v error -framerate 24 -i frames/%04d.png "${AUDIO[@]}" \
            -c:v libx264 -pix_fmt yuv420p -crf 20 -preset slow -movflags +faststart havaldar.mp4
          ls -la havaldar.mp4
      - name: Publish to the renders branch
        env:
          LABEL: ${{ needs.plan.outputs.label }}
        run: |
          git config user.name "skit-render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv havaldar.mp4 /tmp/"$LABEL".mp4
          if git fetch -q origin renders; then git checkout -q -B renders origin/renders; else git checkout -q --orphan renders && git rm -rqf .; fi
          mkdir -p havaldar && cp /tmp/"$LABEL".mp4 havaldar/
          git add havaldar && git commit -qm "Render $LABEL" && git push -q origin renders
          echo "::notice title=Rendered::havaldar/$LABEL.mp4 on branch renders"
