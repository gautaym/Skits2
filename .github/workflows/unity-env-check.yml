name: Unity skit environment check

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unity-env-check-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_IMAGE: unityci/editor:ubuntu-6000.0.85f1-base-3

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check Unity secrets are set
        id: secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "$UNITY_EMAIL" ]    || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::notice::No UNITY_LICENSE/UNITY_SERIAL - will try signing in with email + password"
          fi
          if [ -n "$missing" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            echo "### Missing Unity secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Machine info
        run: |
          { echo '### Runner'; echo '```'; echo "CPUs: $(nproc)"; free -h; df -h /; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /

      - name: Pull Unity editor image
        run: docker pull --quiet "$UNITY_IMAGE"

      - name: Run Unity + skit pipeline check
        if: steps.secrets.outputs.ok == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mkdir -p Output
          docker run --rm \
            -e UNITY_LICENSE -e UNITY_SERIAL -e UNITY_EMAIL -e UNITY_PASSWORD \
            -e SKIT_OUT=/project/Output \
            -v "$PWD":/project -w /project \
            "$UNITY_IMAGE" bash ci/run-in-container.sh

      - name: Write report to summary
        if: always()
        run: |
          if [ -f Output/report.txt ]; then
            { echo '### Skit environment report'; echo '```'; cat Output/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat Output/report.txt
            # Also post as an annotation so it is readable via the public API.
            body=$(head -c 60000 Output/report.txt | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=Skit environment report::${body}"
          fi

      - name: Upload report, logs and test video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skit-env-check
          path: |
            Output/*.txt
            Output/*.log
            Output/*.mp4
            Output/*.wav
            Output/frames/frame_0000.png
            Output/frames/frame_0036.png
          if-no-files-found: ignore

      - name: Fail when Unity secrets are missing
        if: steps.secrets.outputs.ok != 'true'
        run: exit 1
